<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 화면: 잠금 → 홈(여행 요약 + 섬별 여정) / 섬(#big-island 등) / 일정 / 비용, 가격 상세는 시트(#prices/<id>) */
:root {
  --bg: #edf4f5; --surface: #ffffff; --surface-2: #f4f9fa; --fg: #0b2230; --muted: #4a626e; --faint: #566d79;
  --line: #d2dfe3; --grid: #e5eef0;
  --sea-0: #cdeeea; --sea-1: #8fd6d2; --sea-2: #3fa9b9; --sea-3: #1b7597; --sea-4: #11496b; --sea-5: #0a2c45;
  --accent: #0f6d8a; --accent-ink: #ffffff; --accent-soft: rgba(15, 109, 138, 0.10);
  --up: #c22f3d; --down: #1d5ec2; --flat: #62747c; --target: #a65f08;
  --warn: #8f5400; --warn-soft: rgba(214, 138, 0, 0.15);
  --isl-big: #c4441a; --isl-maui: #bc4474; --isl-kauai: #2b7740; --isl-oahu: #13739d;
  --plum-petal: #fff4d6; --plum-edge: #d0921a; --plum-core: #efb01f;
  --ticket: #0a2c45; --ticket-fg: #e6f3f6; --ticket-muted: #a3c6d0; --ticket-up: #ff9aa4; --ticket-down: #a8c8ff; --ticket-line: #7fd8e6; --ticket-base: rgba(230, 243, 246, 0.3); --scrim: rgba(6, 30, 45, 0.48); --shadow: 0 20px 60px rgba(8, 40, 60, 0.24);
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tabbar-h: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061823; --surface: #0b2230; --surface-2: #0f2a3a; --fg: #e2edf1; --muted: #9ab0ba; --faint: #8aa1ab;
    --line: #1c3b4c; --grid: #132f40;
    --sea-0: #2a8a8f; --sea-1: #1d6c7a; --sea-2: #155269; --sea-3: #0f3c52; --sea-4: #0a2a3c; --sea-5: #051823;
    --accent: #58c6dd; --accent-ink: #04202b; --accent-soft: rgba(88, 198, 221, 0.13);
    --up: #ff7582; --down: #7da9ff; --flat: #91a3ab; --target: #f2ae4a;
    --warn: #f4b860; --warn-soft: rgba(244, 184, 96, 0.14);
    --isl-big: #ff7f4f; --isl-maui: #f27fab; --isl-kauai: #66c87b; --isl-oahu: #4fbbe8;
    --plum-petal: #fff0c4; --plum-edge: #f0b43a; --plum-core: #f6c33a;
    --ticket: #123f58; --ticket-fg: #eaf5f8; --ticket-muted: #a9cbd5; --ticket-up: #ffa3ac; --ticket-down: #b3cfff; --ticket-line: #8ee0ec; --ticket-base: rgba(234, 245, 248, 0.32); --scrim: rgba(0, 8, 14, 0.66); --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061823; --surface: #0b2230; --surface-2: #0f2a3a; --fg: #e2edf1; --muted: #9ab0ba; --faint: #8aa1ab;
  --line: #1c3b4c; --grid: #132f40;
  --sea-0: #2a8a8f; --sea-1: #1d6c7a; --sea-2: #155269; --sea-3: #0f3c52; --sea-4: #0a2a3c; --sea-5: #051823;
  --accent: #58c6dd; --accent-ink: #04202b; --accent-soft: rgba(88, 198, 221, 0.13);
  --up: #ff7582; --down: #7da9ff; --flat: #91a3ab; --target: #f2ae4a;
  --warn: #f4b860; --warn-soft: rgba(244, 184, 96, 0.14);
  --isl-big: #ff7f4f; --isl-maui: #f27fab; --isl-kauai: #66c87b; --isl-oahu: #4fbbe8;
  --plum-petal: #fff0c4; --plum-edge: #f0b43a; --plum-core: #f6c33a;
  --ticket: #123f58; --ticket-fg: #eaf5f8; --ticket-muted: #a9cbd5; --ticket-up: #ffa3ac; --ticket-down: #b3cfff; --ticket-line: #8ee0ec; --ticket-base: rgba(234, 245, 248, 0.32); --scrim: rgba(0, 8, 14, 0.66); --shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
html.lock-scroll { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(40px + var(--tabbar-h) + env(safe-area-inset-bottom, 0px));
  overflow-wrap: anywhere; overflow-x: hidden;
}
[hidden] { display: none !important; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { width: 100%; max-width: 1200px; margin: 0 auto; }
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.3; }

/* 수심 띠 */
.depth { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--sea-0) 0 20%, var(--sea-1) 20% 40%, var(--sea-2) 40% 60%, var(--sea-3) 60% 80%, var(--sea-4) 80% 100%); }

/* 작은 표식 */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.4; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; font-weight: 500; }
.tag.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.tag.isl { background: color-mix(in srgb, var(--isl) 14%, transparent); border-color: transparent; color: var(--fg); }
.tag.isl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--isl); }
.tag.off { text-decoration: line-through; }
.tag.warn, .links .tag, .ev-row .tag { white-space: normal; min-width: 0; }
.cnt { font-family: var(--font-num); font-size: 12px; color: var(--faint); font-weight: 500; margin-left: 6px; }
.eyebrow { font-family: var(--font-num); font-size: 12px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; cursor: pointer; }
.pill:hover { border-color: var(--accent); }
.more { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 600; padding: 4px 0; cursor: pointer; }
.btn { font-weight: 600; font-size: 15px; padding: 12px 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-ghost { font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }

/* 잠금 */
.lock { min-height: 86vh; display: grid; place-items: center; }
.lock form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
.lock h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; }
.lock .msg { min-height: 20px; font-size: 13px; color: var(--up); }
.lock label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.lock .check { flex-direction: row; align-items: center; gap: 8px; }
.lock .check input { width: 18px; height: 18px; }
.lock input[type=password] { font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; }

/* 머리 */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding-top: env(safe-area-inset-top, 0px); }
.top-in { display: flex; align-items: center; gap: 12px; min-height: 54px; }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand b { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .num { font-size: 13px; color: var(--accent); font-weight: 600; }
.topnav { display: flex; gap: 2px; margin-left: auto; }
.topnav a { padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; }
.topnav a[aria-current="page"] { color: var(--fg); background: var(--surface); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.top .btn-ghost { flex: none; }

/* 하단 탭 */
.tabbar { display: none; }
@media (max-width: 759px) {
  :root { --tabbar-h: 60px; }
  .topnav { display: none; }
  .top .btn-ghost { margin-left: auto; }
  .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar a { height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 500; }
  .tabbar a svg { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--accent); font-weight: 700; }
}
.ico { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 홈 */
.home { display: grid; gap: 20px; padding-top: 8px; }
.hero { position: relative; padding: 18px 0 4px; display: flex; flex-direction: column; gap: 16px; }
.hero-row { display: flex; align-items: flex-end; gap: 14px 22px; flex-wrap: wrap; }
.dday { font-family: var(--font-num); font-weight: 600; font-size: clamp(48px, 15vw, 76px); line-height: 0.9; letter-spacing: -0.04em; color: var(--fg); }
.dday small { display: block; font-family: var(--font-ui); font-size: 13px; letter-spacing: 0; font-weight: 500; color: var(--muted); margin-top: 8px; }
.hero h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.hero .when { color: var(--muted); font-size: 14px; margin-top: 2px; }
.contour { position: absolute; right: -16px; top: -10px; width: min(460px, 80%); height: 170px; pointer-events: none; color: var(--line); z-index: -1; }

/* 섬 순서 띠 */
.chain { display: flex; gap: 4px; align-items: stretch; list-style: none; margin: 0; padding: 0; }
.chain > * { min-width: 0; }
.seg-stop { flex: 2 1 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--fg); padding-top: 10px; position: relative; }
.seg-stop::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; border-radius: 3px; background: var(--isl); }
.seg-stop.alt::before { background: linear-gradient(90deg, var(--isl-a) 0 50%, var(--isl-b) 50% 100%); }
.seg-stop.fly { flex: 1 1 0; color: var(--muted); }
.seg-stop.fly::before { background: repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 10px); }
.seg-stop .code { font-family: var(--font-num); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
.seg-stop .nm { font-weight: 700; font-size: 14px; line-height: 1.25; word-break: keep-all; overflow-wrap: normal; }
.seg-stop.alt .nm { font-size: 13px; }
.seg-stop .dt { font-family: var(--font-num); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 6px; }
.seg-link { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: inherit; min-width: 0; }
.seg-link:hover .nm { color: var(--accent); }

/* 요약 블록 */
.sum-grid { display: grid; gap: 12px; }
.money { background: var(--surface); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); }
.money .k { font-size: 13px; color: var(--muted); }
.money .big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.money .big small { font-family: var(--font-ui); font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.progress { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--down); border-radius: 4px; min-width: 0; }
.money .row { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.money .row b { color: var(--fg); font-family: var(--font-num); font-weight: 600; }
.money .ref { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.money .ref b { color: var(--fg); font-family: var(--font-num); }

/* 항공 시세 보딩패스 */
.ticket { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; text-decoration: none; background: var(--ticket); color: var(--ticket-fg); border-radius: 14px; padding: 14px 16px; overflow: hidden; }
.ticket .tk-e, .ticket .tk-r, .ticket .tk-s { grid-column: 1; }
.ticket .tk-e { font-family: var(--font-num); font-size: 11px; letter-spacing: 0.08em; color: var(--ticket-muted); text-transform: uppercase; }
.ticket .tk-r { font-family: var(--font-num); font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
.ticket .tk-s { font-size: 12px; color: var(--ticket-muted); }
.ticket .tk-p { position: relative; grid-column: 2; grid-row: 1 / span 3; align-self: stretch; justify-content: center; text-align: right; border-left: 2px dashed color-mix(in srgb, var(--ticket-fg) 28%, transparent); padding-left: 16px; min-width: 112px; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.ticket .tk-p::before, .ticket .tk-p::after { content: ""; position: absolute; left: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); }
.ticket .tk-p::before { top: -22px; } .ticket .tk-p::after { bottom: -22px; }
.ticket .tk-p b { font-family: var(--font-num); font-size: 17px; font-weight: 600; }
.ticket .tk-p .d { font-family: var(--font-num); font-size: 12px; }
.ticket .tk-p .d.up { color: var(--ticket-up); } .ticket .tk-p .d.down { color: var(--ticket-down); } .ticket .tk-p .d.flat { color: var(--ticket-muted); }
.ticket .spark { width: 96px; height: 26px; }
.ticket .spark .ln { stroke: var(--ticket-line); } .ticket .spark .end { fill: var(--ticket-line); } .ticket .spark .base { stroke: var(--ticket-base); }
.ticket:hover .tk-r { text-decoration: underline; text-underline-offset: 3px; }

/* 섬별 여정 카드 */
.sec-title { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 2px; }
.sec-title h2 { font-size: 18px; font-weight: 700; }
.sec-title span { font-size: 13px; color: var(--muted); }
.stops { display: grid; gap: 12px; }
.stop { display: flex; flex-direction: column; gap: 8px; }
.stop-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.stop-head .n { font-family: var(--font-num); font-weight: 600; color: var(--fg); }
.stop-opts { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.stop.alt .stop-opts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.isle-mini { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--fg); background: var(--surface); border-radius: 12px; padding: 14px; position: relative; overflow: hidden; border: 1px solid var(--line); }
.isle-mini::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--isl); }
.isle-mini:hover { border-color: var(--isl); }
.isle-mini .top-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 6px; align-items: center; }
.isle-mini .code { font-family: var(--font-num); font-size: 11px; letter-spacing: 0.08em; color: var(--muted); white-space: nowrap; }
.isle-mini h3 { font-size: 18px; font-weight: 700; }
.isle-mini .line { font-size: 13px; color: var(--muted); }
.isle-mini .line b { color: var(--fg); font-family: var(--font-num); font-weight: 600; }
.isle-mini .fav-line { font-size: 13px; display: flex; gap: 6px; align-items: center; color: var(--fg); }
.fav-mark svg { width: 18px; height: 18px; display: block; }
.fav-mark .pt { fill: var(--plum-petal); stroke: var(--plum-edge); stroke-width: 1.4; }
.fav-mark .core { fill: var(--plum-core); }
.isle-mini .courses-line { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.foot { font-size: 12px; color: var(--muted); margin-top: 28px; line-height: 1.6; }

/* 섬 화면 */
.isle { padding-top: 6px; display: flex; flex-direction: column; gap: 20px; }
.inav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; position: sticky; top: calc(54px + env(safe-area-inset-top, 0px)); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 6px 0 10px; }
.inav-grp { display: inline-flex; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); padding: 2px; }
.inav-grp a { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; min-height: 34px; border-radius: 999px; text-decoration: none; color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.inav-grp a i { width: 7px; height: 7px; border-radius: 50%; background: var(--isl); }
.inav-grp a[aria-current="page"] { background: color-mix(in srgb, var(--isl) 16%, var(--surface)); color: var(--fg); }
.inav-arrow { color: var(--faint); font-size: 12px; }
@media (max-width: 419px) {
  .inav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scroll-padding-inline: 16px; }
  .inav::-webkit-scrollbar { display: none; }
  .inav-arrow { display: none; }
  .inav-grp { flex: none; }
  .inav-grp a { padding: 6px 9px; font-size: 12.5px; }
}
.isle-head { position: relative; padding: 18px 16px 16px; border-radius: 16px; overflow: hidden;
  background: linear-gradient(160deg, color-mix(in srgb, var(--isl) 20%, var(--surface)) 0%, var(--surface) 70%); border: 1px solid color-mix(in srgb, var(--isl) 24%, var(--line)); display: flex; flex-direction: column; gap: 10px; }
.isle-head .eyebrow { color: color-mix(in srgb, var(--isl) 60%, var(--fg)); }
.isle-head h2 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.isle-head .when { font-size: 14px; color: var(--muted); }
.isle-head .when b { color: var(--fg); font-weight: 600; }
.nights { display: flex; flex-wrap: wrap; gap: 6px; }
.night { font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.night b { font-family: var(--font-num); color: var(--fg); font-weight: 600; margin-right: 4px; }
.evs { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.evs div { display: flex; gap: 8px; align-items: center; }
.alt-note { font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--muted); }
.alt-note a { font-weight: 600; }
.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.clamp.open { display: block; }
.para { margin: 0; font-size: 14px; color: var(--muted); }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.isle-grid { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1000px) { .isle-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } }
.blk { display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 120px; }
.blk-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.blk-head h3 { font-size: 18px; font-weight: 700; }
.blk-head span { font-size: 13px; color: var(--muted); }

/* 숙소 비교 */
.stays { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }
.stay { padding: 12px 12px 12px 6px; border-top: 1px solid var(--grid); scroll-margin-top: 120px; }
.stay:first-child { border-top: 0; }
.stay-top { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 0 8px; align-items: start; }
.fav { width: 40px; height: 40px; border: 0; background: none; padding: 8px; cursor: pointer; border-radius: 10px; color: var(--faint); }
.fav svg { width: 24px; height: 24px; display: block; }
.fav .pt { fill: none; stroke: currentColor; stroke-width: 1.4; }
.fav .core { fill: none; stroke: currentColor; stroke-width: 1.4; }
.fav[aria-pressed="true"] .pt { fill: var(--plum-petal); stroke: var(--plum-edge); }
.fav[aria-pressed="true"] .core { fill: var(--plum-core); stroke: var(--plum-core); }
.fav:hover { color: var(--plum-edge); }
.stay-toggle { text-align: left; border: 0; background: none; padding: 6px 0 0; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stay-name { font-weight: 700; font-size: 15px; line-height: 1.35; }
.stay-toggle::after { content: "자세히"; font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 3px; }
.stay.open .stay-toggle::after { content: "접기"; }
.stay-sub { font-size: 12px; color: var(--muted); }
.stay-price { text-align: right; text-decoration: none; color: var(--fg); display: flex; flex-direction: column; align-items: flex-end; padding-top: 6px; border-radius: 6px; }
.stay-price b { font-family: var(--font-num); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stay-price .per { font-size: 12px; color: var(--muted); }
.stay-price .tot { font-size: 12px; color: var(--muted); font-family: var(--font-num); }
a.stay-price:hover b { color: var(--accent); }
.stay-meter { margin: 8px 0 0 48px; display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(64px, auto); gap: 10px; align-items: center; }
.bar { height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--isl); border-radius: 3px; opacity: 0.85; }
.spark { width: 76px; height: 24px; display: block; overflow: visible; }
.spark .ln { fill: none; stroke: var(--isl, var(--accent)); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.spark .end { fill: var(--isl, var(--accent)); }
.spark .base { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.delta-s { font-family: var(--font-num); font-size: 12px; text-align: right; white-space: nowrap; }
.cs-note { margin: 8px 0 0 48px; }
.cs-note .tag { white-space: normal; }
.stay-detail { margin: 12px 0 4px 48px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; }
.why { margin: 0; }
.pc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 600px) { .pc { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.pc h5 { font-size: 13px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
.pc .good h5::before, .pc .bad h5::before { content: ""; width: 10px; height: 2px; border-radius: 1px; background: var(--down); }
.pc .bad h5::before { background: var(--up); }
.pc ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.pc li { padding-left: 12px; position: relative; line-height: 1.5; }
.pc li::before { content: ""; position: absolute; left: 0; top: 0.7em; width: 4px; height: 4px; border-radius: 50%; background: var(--faint); }
.src-tag { display: inline; font-size: 12px; color: var(--faint); margin-left: 4px; }
.note { margin: 0; font-size: 13px; color: var(--muted); }
.note b { color: var(--fg); font-weight: 600; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
details.srcs-d summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); list-style: none; padding: 4px 0; }
details.srcs-d summary::-webkit-details-marker { display: none; }
details.srcs-d summary::before { content: "+ "; font-family: var(--font-num); }
details.srcs-d[open] summary::before { content: "− "; }
.srcs { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.src-line { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.src-line .date { font-size: 12px; color: var(--faint); }
.tk { margin: 2px 0 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* 하루 코스 */
.courses { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.course { background: var(--surface-2); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 120px; }
.course-head { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.course-head h4 { font-size: 15px; font-weight: 700; }
.course-area { font-size: 12px; color: var(--muted); margin-top: -4px; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.tl li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; position: relative; padding-bottom: 10px; }
.tl li::before { content: ""; position: absolute; left: 63px; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--isl); }
.tl li::after { content: ""; position: absolute; left: 66px; top: 18px; bottom: 0; width: 1px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl li:last-child { padding-bottom: 0; }
.tl .tm { font-size: 12px; color: var(--muted); padding-top: 2px; text-align: right; }
.tl-body { padding-left: 14px; display: flex; flex-direction: column; min-width: 0; }
.step-spot { border: 0; background: none; padding: 0; text-align: left; font-weight: 600; font-size: 14px; cursor: pointer; color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.step-spot:hover { text-decoration-color: var(--accent); }
.tl-note { font-size: 12px; color: var(--muted); }
.tl-when { font-size: 12px; color: var(--muted); font-family: var(--font-num); }
.back { align-self: flex-start; }
.tip { margin: 0; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }

/* 지역별 스폿 */
.areas { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .areas { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.area { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.area h4 { font-size: 15px; font-weight: 700; display: flex; align-items: baseline; }
.spots { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.spot { border-bottom: 1px solid var(--grid); scroll-margin-top: 120px; }
.spot-toggle { width: 100%; text-align: left; border: 0; background: none; padding: 10px 0; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
.spot-toggle .nm { font-weight: 600; font-size: 14px; }
.spot-toggle .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 12px; color: var(--muted); }
.spot-toggle .chev { font-family: var(--font-num); color: var(--faint); font-size: 14px; }
.spot.open { background: linear-gradient(90deg, transparent, var(--surface-2) 30%); }
.spot-detail { padding: 0 0 12px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; }
.facts dt { color: var(--muted); font-size: 12px; padding-top: 1px; white-space: nowrap; }
.facts dd { margin: 0; }
.caution { margin: 0; font-size: 13px; color: var(--warn); }
.spot-detail p { margin: 0; }

/* 일정 */
.page { padding-top: 14px; display: flex; flex-direction: column; gap: 18px; }
.page-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.page-title h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
.page-title span { color: var(--muted); font-size: 14px; }
.days { list-style: none; margin: 0; padding: 0; max-width: 760px; }
.day { display: grid; grid-template-columns: 74px 18px minmax(0, 1fr); gap: 0 10px; }
.day .d { text-align: right; padding: 12px 0; }
.day .d b { font-family: var(--font-num); font-weight: 600; font-size: 15px; display: block; }
.day .d small { font-size: 12px; color: var(--muted); }
.day .rail { position: relative; }
.day .rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.day:first-child .rail::before { top: 20px; } .day:last-child .rail::before { bottom: calc(100% - 20px); }
.day .rail i { position: absolute; left: 3px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--isl, var(--surface)); border: 2px solid var(--isl, var(--line)); }
.day .rail i.split { background: linear-gradient(90deg, var(--isl-a) 0 50%, var(--isl-b) 50% 100%); border-color: var(--bg); }
.day .ev { padding: 10px 0 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--grid); min-width: 0; }
.day:last-child .ev { border-bottom: 0; }
.ev-row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 14px; }
.ev-row .tm { font-family: var(--font-num); font-size: 12px; color: var(--muted); min-width: 38px; }
.ev-row .pl { font-family: var(--font-num); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.ev-row .sub { font-size: 12px; color: var(--muted); flex-basis: 100%; }
.isl-link { text-decoration: none; }
.isl-link:hover { text-decoration: underline; }
.empty { color: var(--faint); font-size: 13px; }

/* 비용 */
.cost-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 760px) { .cost-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cstat { display: flex; flex-direction: column; gap: 2px; padding: 12px 0; border-top: 2px solid var(--fg); }
.cstat .k { font-size: 13px; color: var(--muted); }
.cstat .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cstat .s { font-size: 12px; color: var(--muted); }
.cat { display: flex; flex-direction: column; gap: 8px; }
.cat h3 { font-size: 15px; font-weight: 700; color: var(--muted); }
.items { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; border: 1px solid var(--line); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px; border-top: 1px solid var(--grid); }
.item:first-child { border-top: 0; }
.item .t { font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.item .sub { font-size: 13px; color: var(--muted); }
.item .amt { text-align: right; font-family: var(--font-num); font-weight: 600; white-space: nowrap; font-size: 16px; }
.item .amt small { display: block; font-family: var(--font-ui); font-weight: 400; font-size: 12px; color: var(--muted); }
.item ul { margin: 4px 0 0; padding-left: 16px; font-size: 13px; color: var(--muted); }
.ref-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ref-list li { display: flex; justify-content: space-between; gap: 12px; }
.ref-list .num { white-space: nowrap; }
.empty-cats { font-size: 13px; color: var(--muted); }

/* 가격 시트 */
dialog.sheet { overflow-y: auto; overscroll-behavior: contain; padding: 0; border: 0; background: var(--surface); color: var(--fg); width: 100%; max-width: 100%; max-height: 92vh; max-height: 92dvh; margin: auto 0 0; border-radius: 18px 18px 0 0; box-shadow: var(--shadow); }
dialog.sheet::backdrop { background: var(--scrim); }
@media (min-width: 760px) { dialog.sheet { width: min(780px, calc(100vw - 48px)); margin: auto; border-radius: 18px; max-height: 88vh; } }
.sheet-in { padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-head { position: sticky; top: 0; z-index: 2; background: var(--surface); padding: 14px 0 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; border-bottom: 1px solid var(--grid); }
.sheet-head::before { content: ""; position: absolute; left: 50%; top: 6px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
.sheet-head h2 { font-size: 17px; font-weight: 700; }
.sheet-head .detail { font-size: 13px; color: var(--muted); }
.x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); }
.quote { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 24px; }
.price-big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: clamp(32px, 9vw, 44px); font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
.price-big small { font-family: var(--font-ui); font-size: 0.38em; font-weight: 500; margin-left: 4px; color: var(--muted); }
.delta { font-family: var(--font-num); font-size: 15px; font-weight: 600; }
.small { font-size: 12px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
@media (max-width: 759px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats > .stat:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.stat { background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .s { font-size: 11px; color: var(--muted); }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; }
.chart-head h3 { font-size: 14px; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font-size: 13px; font-weight: 500; padding: 6px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.legend { font-size: 12px; min-height: 18px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
.legend b { color: var(--fg); font-family: var(--font-num); font-weight: 600; }
.chart-box { position: relative; height: 280px; }
@media (min-width: 760px) { .chart-box { height: 320px; } }
#chart { position: absolute; inset: 0; }
.chart-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); background: var(--surface); font-size: 14px; }
.chart-note { font-size: 12px; color: var(--muted); margin-top: -6px; }
.log { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.log li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 14px; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 14px; align-items: baseline; }
.log .p { font-family: var(--font-num); font-weight: 600; text-align: right; }
.log .df { font-family: var(--font-num); font-size: 12px; text-align: right; min-width: 70px; }
.log .src { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; }
.sel { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.sel select { font: inherit; font-size: 15px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; max-width: 100%; }

/* 데스크톱 홈 */
@media (min-width: 900px) {
  .home { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); column-gap: 40px; }
  .home > .hero { grid-column: 1; grid-row: 1; }
  .home > .sum-grid { grid-column: 2; grid-row: 1; align-self: end; }
  .home > .journey { grid-column: 1 / -1; }
  .stops { grid-template-columns: var(--stops-cols, repeat(auto-fit, minmax(0, 1fr))); align-items: stretch; }
  .stop .stop-opts { flex: 1; }
  .isle-mini { height: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<body>
<div class="wrap">
  <section class="lock" id="lock">
    <form id="lock-form" autocomplete="off">
      <div class="depth" aria-hidden="true"></div>
      <h1>Trip</h1>
      <label>비밀번호<input type="password" id="pw" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" id="remember" checked>이 기기에서 기억</label>
      <button class="btn" type="submit" id="unlock">열기</button>
      <div class="msg" id="lock-msg" role="status"></div>
    </form>
  </section>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap top-in">
      <a class="brand" href="#home"><b id="title"></b><span class="num" id="dday-chip"></span></a>
      <nav class="topnav" aria-label="화면">
        <a href="#home" data-nav="home">홈</a>
        <a href="#big-island" data-nav="island">섬</a>
        <a href="#schedule" data-nav="schedule">일정</a>
        <a href="#costs" data-nav="costs">비용</a>
      </nav>
      <button class="btn-ghost" type="button" id="lock-btn">잠그기</button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <div class="wrap"><p class="foot" id="foot"></p></div>
  <nav class="tabbar" aria-label="화면">
    <a href="#home" data-nav="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7"/><path d="M6 10v9h12v-9"/></svg>홈</a>
    <a href="#big-island" data-nav="island"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18c2 0 2-1.5 4.5-1.5S10 18 12 18s2-1.5 4.5-1.5S19 18 21 18"/><path d="M7 15c1-4 4-7 7-7 2 0 3.5 1.5 4 3"/><path d="M12 8c-1-2-3-3-5-2"/></svg>섬</a>
    <a href="#schedule" data-nav="schedule"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>일정</a>
    <a href="#costs" data-nav="costs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/></svg>비용</a>
  </nav>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sh-title">
  <div class="sheet-in">
    <header class="sheet-head">
      <div>
        <div class="eyebrow" id="sh-cat"></div>
        <h2 id="sh-title"></h2>
        <div class="detail" id="sh-detail"></div>
      </div>
      <button class="x" type="button" id="sh-close" aria-label="닫기">×</button>
    </header>
    <section class="quote" aria-label="현재 최저가">
      <div>
        <div class="small" id="pr-quote-label">오늘의 최저가</div>
        <div class="price-big" id="pr-now">—</div>
      </div>
      <div>
        <div class="delta flat" id="pr-delta"></div>
        <div class="small" id="pr-delta-sub">&nbsp;</div>
      </div>
    </section>
    <div class="stats" id="pr-stats"></div>
    <div class="chart-head">
      <h3>가격 추이</h3>
      <div class="controls">
        <div class="seg" role="group" aria-label="기간">
          <button type="button" data-range="7">1주</button>
          <button type="button" data-range="30">1개월</button>
          <button type="button" data-range="90">3개월</button>
          <button type="button" data-range="all" aria-pressed="true">전체</button>
        </div>
        <div class="seg" role="group" aria-label="차트 형태">
          <button type="button" data-mode="line" aria-pressed="true">일별</button>
          <button type="button" data-mode="candle">주봉</button>
        </div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-box">
      <div id="chart"></div>
      <div class="chart-empty" id="chart-empty">아직 가격 기록이 없어요. 매일 자동 수집이 돌면 쌓여요.</div>
    </div>
    <div class="chart-note" id="chart-note"></div>
    <div class="links" id="sh-links"></div>
    <section>
      <div class="chart-head" style="margin-bottom:6px"><h3>기록</h3></div>
      <ol class="log" id="pr-log"></ol>
    </section>
    <label class="sel">다른 항목 보기<select id="tracker-select"></select></label>
  </div>
</dialog>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
  const STORE = 'trip-key-v1';
  const FAV_STORE = 'trip-fav-v1';
  const $ = id => document.getElementById(id);
  const won = n => Math.round(n).toLocaleString('ko-KR');
  const manwon = n => (n / 10000).toLocaleString('ko-KR', { maximumFractionDigits: 1 }) + '만';
  const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const parseDay = s => new Date(s + 'T00:00:00');
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const dot = s => s.replace(/-/g, '.');
  const md = s => dot(s.slice(5));
  const dow = s => WEEK[parseDay(s).getDay()];
  const withDow = s => dot(s) + ' (' + dow(s) + ')';
  const mdDow = s => md(s) + ' (' + dow(s) + ')';
  const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);

  const CATEGORY = { flight: '항공', stay: '숙소', activity: '투어·액티비티', transport: '교통·렌터카', insurance: '보험', etc: '기타' };
  const CATEGORY_ORDER = ['flight', 'stay', 'activity', 'transport', 'insurance', 'etc'];
  const STATUS = { idea: ['후보', ''], tracking: ['시세 추적', 'warn'], booked: ['예약', 'on'], paid: ['결제 완료', 'on'], cancelled: ['취소', 'off'] };
  const KIND = { sight: '명소', beach: '해변', activity: '액티비티', tour: '투어', food: '맛집', shopping: '쇼핑', view: '전망' };
  const TIER = { luxury: '럭셔리', upper: '상급', mid: '중급' };
  const SRC = { blog: '블로그', youtube: '유튜브', cafe: '카페', official: '공식', other: '기타' };
  // 섬 표식: 띠·칩·차트 선에만 쓰는 색과 공항 코드
  const ISLAND_META = {
    'big-island': { code: 'KOA', en: 'Big Island', color: '--isl-big' },
    maui: { code: 'OGG', en: 'Maui', color: '--isl-maui' },
    kauai: { code: 'LIH', en: 'Kauai', color: '--isl-kauai' },
    oahu: { code: 'HNL', en: 'Oahu', color: '--isl-oahu' },
  };
  const meta = key => ISLAND_META[key] || { code: '', en: key, color: '--accent' };
  const islVar = key => '--isl: var(' + meta(key).color + ')';

  // 요소 생성: h('td', { className: 'r' }, '텍스트', 자식...)
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'style') el.style.cssText = v; else if (k in el && !k.includes('-')) el[k] = v; else el.setAttribute(k, v);
    }
    for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) el.append(k);
    return el;
  }
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
    for (const k of kids) if (k) el.append(k);
    return el;
  }
  const fill = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false));
  const tag = (text, cls) => h('span', { className: 'tag ' + (cls || '') }, text);
  const badge = status => { const [t, c] = STATUS[status] || [status, '']; return tag(t, c); };
  const ext = (url, text, cls) => h('a', { href: url, target: '_blank', rel: 'noopener', className: cls || null }, text);
  const trendCls = diff => diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
  const arrow = diff => diff > 0 ? '▲ ' : diff < 0 ? '▼ ' : '– ';

  // ---------- 복호화 ----------
  const b64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
  const unb64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  let enc = null;

  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(enc.salt), iterations: enc.iterations },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  async function decrypt(key) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(enc.iv) }, key, b64(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function readCache() { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } }
  function writeCache(v) { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) {} }

  async function boot() {
    try {
      const r = await fetch('data.enc', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      enc = await r.json();
    } catch (e) {
      $('lock-msg').textContent = '데이터를 불러오지 못했어요. 새로고침해 주세요.';
      $('unlock').disabled = true;
      return;
    }
    const c = readCache();
    if (c && c.salt === enc.salt) {
      try {
        const key = await crypto.subtle.importKey('raw', b64(c.raw), 'AES-GCM', true, ['decrypt']);
        return open(await decrypt(key));
      } catch (e) { writeCache(null); }
    }
    $('pw').focus();
  }

  $('lock-form').addEventListener('submit', async e => {
    e.preventDefault();
    if (!enc) return;
    $('unlock').disabled = true; $('lock-msg').textContent = '';
    try {
      const key = await deriveKey($('pw').value);
      const data = await decrypt(key);
      if ($('remember').checked) writeCache({ salt: enc.salt, raw: unb64(await crypto.subtle.exportKey('raw', key)) });
      $('pw').value = '';
      open(data);
    } catch (err) {
      $('lock-msg').textContent = '비밀번호가 맞지 않아요.';
    } finally { $('unlock').disabled = false; }
  });
  $('lock-btn').addEventListener('click', () => { writeCache(null); location.reload(); });

  // ---------- 찜 (이 기기에만 저장) ----------
  let favs = new Set();
  function readFavs() { try { const v = JSON.parse(localStorage.getItem(FAV_STORE) || '[]'); return new Set(Array.isArray(v) ? v : []); } catch (e) { return new Set(); } }
  function writeFavs() { try { localStorage.setItem(FAV_STORE, JSON.stringify([...favs])); } catch (e) {} }

  // ---------- 데이터 계산 ----------
  let D = null;
  const today = ymd(new Date());
  let trackerById = new Map(), islandOfTracker = new Map();

  function quotesOf(trackerId) {
    // 하루 한 값: 직접 기록(manual)이 있으면 그 값, 없으면 자동값
    const m = new Map();
    for (const q of D.quotes) {
      if (q.tracker !== trackerId) continue;
      const prev = m.get(q.date);
      if (!prev || (q.kind === 'manual' && prev.kind !== 'manual')) m.set(q.date, q);
    }
    return [...m.values()].sort((a, b) => a.date < b.date ? -1 : 1);
  }
  function latest(trackerId) { const sr = quotesOf(trackerId); return sr[sr.length - 1] || null; }

  // 항목 금액: 확정가 → 없으면 연결된 시세 × 수량(예상) → 없으면 미정
  function costOf(it) {
    const paid = (it.payments || []).reduce((sum, p) => sum + p.amount, 0);
    if (it.status === 'cancelled') return { amount: 0, paid, kind: 'cancelled' };
    if (Number.isInteger(it.price)) return { amount: it.price, paid, kind: 'fixed' };
    if (it.tracker) {
      const q = latest(it.tracker);
      if (q) return { amount: q.price * (it.quantity || 1), paid, kind: 'estimate', quote: q };
    }
    return { amount: null, paid, kind: 'unknown' };
  }
  function totals() {
    let fixed = 0, estimate = 0, paid = 0, unknown = 0;
    for (const it of D.items) {
      const c = costOf(it);
      paid += c.paid;
      if (c.kind === 'fixed') fixed += c.amount;
      else if (c.kind === 'estimate') estimate += c.amount;
      else if (c.kind === 'unknown') unknown++;
    }
    return { fixed, estimate, total: fixed + estimate, paid, unknown };
  }
  function amountText(c) {
    if (c.kind === 'cancelled') return '—';
    if (c.amount === null) return '미정';
    return (c.kind === 'estimate' ? '≈ ' : '') + won(c.amount);
  }
  function deltaText(diff, base) {
    const pct = base ? Math.abs(diff / base * 100).toFixed(1) : '0.0';
    return arrow(diff) + won(Math.abs(diff)) + '원 (' + (diff > 0 ? '+' : diff < 0 ? '−' : '') + pct + '%)';
  }
  const activeTrackers = () => D.trackers.filter(t => t.active !== false);

  // ---------- 섬 정보 ----------
  const staysIslands = () => (D.stays && D.stays.islands) || [];
  const courseIslands = () => (D.courses && D.courses.islands) || [];
  function islandName(key) {
    const a = staysIslands().find(i => i.key === key);
    const b = courseIslands().find(i => i.island === key);
    return (a && a.name) || (b && b.name) || key;
  }
  // 섬 순서: plan.order 를 도착일부터 박수만큼 이어 붙인다
  function stops() {
    const plan = D.plan;
    if (!plan || !plan.order) return [];
    const cur = parseDay(plan.arrival);
    return plan.order.map((st, i) => {
      const start = ymd(cur); cur.setDate(cur.getDate() + st.nights); const end = ymd(cur);
      return { i, keys: [st.island, ...(st.alternatives || [])], nights: st.nights, start, end };
    });
  }
  function islandKeys() {
    const keys = stops().flatMap(st => st.keys);
    for (const i of staysIslands()) if (!keys.includes(i.key)) keys.push(i.key);
    for (const i of courseIslands()) if (!keys.includes(i.island)) keys.push(i.island);
    return keys;
  }
  function stopOf(key) { return stops().find(st => st.keys.includes(key)) || null; }
  function isle(key) {
    const stay = staysIslands().find(i => i.key === key) || null;
    const course = courseIslands().find(i => i.island === key) || null;
    const st = stopOf(key);
    const start = (stay && stay.start) || (st && st.start) || null;
    const end = (stay && stay.end) || (st && st.end) || null;
    const nights = start && end ? daysBetween(start, end) : (st ? st.nights : null);
    const status = stay ? stay.status : (st && st.keys.length > 1 ? 'candidate' : 'confirmed');
    return { key, name: islandName(key), m: meta(key), stay, course, stop: st, start, end, nights, status };
  }
  const dayNo = date => daysBetween(D.trip.start, date) + 1;

  // 섬의 숙소 후보: 최신 1박가 오름차순, 가격 없는 곳은 뒤로
  function hotelsOf(key) {
    const isl = staysIslands().find(i => i.key === key);
    if (!isl) return [];
    return (isl.hotels || []).map(ht => {
      const tr = ht.tracker ? trackerById.get(ht.tracker) || null : null;
      const series = ht.tracker ? quotesOf(ht.tracker) : [];
      const q = series[series.length - 1] || null;
      const cs = ht.tracker && D.collectStatus ? D.collectStatus[ht.tracker] || null : null;
      return { ht, tr, series, q, cs };
    }).sort((a, b) => (a.q ? a.q.price : Infinity) - (b.q ? b.q.price : Infinity));
  }
  const usable = x => x.q && !(x.cs && x.cs.state === 'unavailable');
  function csText(cs) {
    if (!cs || cs.state === 'ok') return null;
    if (cs.state === 'unavailable') return '이 날짜 빈방 없음' + (cs.message ? ' · ' + cs.message : '');
    if (cs.state === 'large-room-only') return '2인 객실 없음, 큰 객실 가격';
    return '최근 수집 실패';
  }

  // 숙소 참고 금액: 찜한 숙소(없으면 섬별 최저가) × 박수. 총액에는 넣지 않는다
  function refBasis(parts) {
    const n = parts.filter(p => p.fav).length;
    return n === 0 ? '섬별 최저가' : n === parts.length ? '찜한 숙소' : '찜한 숙소(없는 섬은 최저가)';
  }
  function stayReference() {
    let sum = 0; const parts = [];
    for (const st of stops()) {
      let pick = null;
      for (const key of st.keys) {
        const f = hotelsOf(key).filter(x => usable(x) && favs.has(x.ht.id));
        if (f.length) { pick = { key, x: f[0], fav: true }; break; }
      }
      if (!pick) {
        const all = hotelsOf(st.keys[0]).filter(usable);
        if (all.length) pick = { key: st.keys[0], x: all[0], fav: false };
      }
      if (pick) {
        const n = isle(pick.key).nights || st.nights;
        pick.nights = n; pick.amount = pick.x.q.price * n;
        sum += pick.amount; parts.push(pick);
      }
    }
    return { sum, parts };
  }

  // ---------- 작은 그림 ----------
  function spark(list, w, hh) {
    w = w || 76; hh = hh || 24;
    const pts = list.slice(-14);
    if (!pts.length) return null;
    const el = s('svg', { viewBox: '0 0 ' + w + ' ' + hh, class: 'spark', width: w, height: hh, 'aria-hidden': 'true', focusable: 'false' });
    const pad = 3;
    if (pts.length === 1) {
      el.append(s('line', { x1: pad, y1: hh / 2, x2: w - pad, y2: hh / 2, class: 'base' }), s('circle', { cx: w - pad, cy: hh / 2, r: 2.8, class: 'end' }));
      return el;
    }
    const vals = pts.map(q => q.price), mn = Math.min(...vals), mx = Math.max(...vals), span = (mx - mn) || 1;
    const xy = pts.map((q, i) => [pad + i * (w - 2 * pad) / (pts.length - 1), mx === mn ? hh / 2 : pad + (mx - q.price) / span * (hh - 2 * pad)]);
    const last = xy[xy.length - 1];
    el.append(s('polyline', { points: xy.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), class: 'ln' }), s('circle', { cx: last[0].toFixed(1), cy: last[1].toFixed(1), r: 2.8, class: 'end' }));
    return el;
  }
  function plumeria() {
    const g = s('g', null);
    for (let k = 0; k < 5; k++) g.append(s('ellipse', { cx: 12, cy: 6.6, rx: 3.3, ry: 5.2, transform: 'rotate(' + (k * 72) + ' 12 12)', class: 'pt' }));
    return s('svg', { viewBox: '0 0 24 24', 'aria-hidden': 'true', focusable: 'false' }, g, s('circle', { cx: 12, cy: 12, r: 2.1, class: 'core' }));
  }
  function contour() {
    const el = s('svg', { viewBox: '0 0 460 170', class: 'contour', 'aria-hidden': 'true', fill: 'none', stroke: 'currentColor', 'stroke-width': '1' });
    const paths = ['M30 150 C90 110 120 60 210 52 C300 44 340 90 430 70', 'M60 160 C120 128 150 84 220 78 C300 70 340 112 440 98', 'M100 168 C150 146 180 112 230 106 C300 98 350 132 450 126', 'M150 170 C190 160 210 138 240 134 C300 128 360 152 460 150'];
    for (const d of paths) el.append(s('path', { d }));
    return el;
  }
  const PLANE = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13.5 21 7l-2.5 5.5L21 18 3 11.5"/><path d="M9 11.2 7 5h2.5l4 4.6"/></svg>';
  const icon = markup => { const sp = h('span', { 'aria-hidden': 'true', style: 'display:inline-flex' }); sp.innerHTML = markup; return sp; };

  function clampPara(text, cls) {
    const p = h('p', { className: 'para clamp ' + (cls || '') }, text);
    if (text.length < 110) { p.classList.remove('clamp'); return p; }
    const b = h('button', { type: 'button', className: 'more', 'aria-expanded': 'false' }, '더 보기');
    b.addEventListener('click', () => { const o = p.classList.toggle('open'); b.textContent = o ? '접기' : '더 보기'; b.setAttribute('aria-expanded', String(o)); });
    return h('div', null, p, b);
  }
  function sourcesBlock(list, label) {
    list = list || [];
    if (!list.length) return null;
    return h('details', { className: 'srcs-d' },
      h('summary', null, (label || '후기') + ' ' + list.length + '개'),
      h('ul', { className: 'srcs' }, list.map(src => h('li', null,
        h('div', { className: 'src-line' },
          tag(SRC[src.type] || src.type),
          ext(src.url, src.title),
          src.status === 'login-required' ? tag('카페 가입 필요', 'warn') : null,
          src.status === 'unverified' ? tag('제목만 확인') : null,
          src.publishedAt ? h('span', { className: 'date num' }, src.publishedAt) : null,
        ),
        src.takeaway ? h('p', { className: 'tk' }, src.takeaway) : null,
      ))));
  }

  // ---------- 머리 ----------
  function ddayText() {
    const d = daysBetween(today, D.trip.start);
    if (d > 0) return 'D-' + d;
    if (d === 0) return 'D-DAY';
    return today <= D.trip.end ? dayNo(today) + '일차' : '다녀왔어요';
  }
  function ddaySub() {
    const d = daysBetween(today, D.trip.start);
    if (d > 0) return '출발까지';
    if (d === 0) return '오늘 출발';
    return today <= D.trip.end ? '여행 중' : null;
  }
  function renderHead() {
    const t = D.trip;
    document.title = t.title || 'Trip';
    $('title').textContent = t.title || 'Trip';
    $('dday-chip').textContent = ddayText();
    const upd = [D.stays && D.stays.updatedAt ? '숙소 조사 ' + dot(D.stays.updatedAt) : null, D.courses && D.courses.updatedAt ? '코스 조사 ' + dot(D.courses.updatedAt) : null].filter(Boolean).join(' · ');
    $('foot').textContent = '데이터 기준 ' + D.builtAt.slice(0, 16).replace('T', ' ') + (upd ? ' · ' + upd : '') + ' · 시세는 Google 에서 매일 자동 수집한 값이라 실제 결제 화면과 다를 수 있어요. 오르면 빨강, 내리면 파랑. 찜은 이 기기에만 저장돼요.';
  }

  // ---------- 홈 ----------
  function chainStrip() {
    const el = h('ul', { className: 'chain', 'aria-label': '섬 순서' });
    for (const st of stops()) {
      const when = [h('span', null, md(st.start) + '–' + st.end.slice(8)), h('span', null, st.nights + '박')];
      if (st.keys.length > 1) {
        const [a, b] = st.keys;
        el.append(h('li', { className: 'seg-stop alt', style: '--isl-a: var(' + meta(a).color + '); --isl-b: var(' + meta(b).color + ')' },
          h('a', { className: 'seg-link', href: '#' + a },
            h('span', { className: 'code' }, st.keys.map(k => meta(k).code).join('/')),
            h('span', { className: 'nm' }, st.keys.map(islandName).join(' / ')),
            h('span', { className: 'dt' }, when))));
      } else {
        const k = st.keys[0];
        el.append(h('li', { className: 'seg-stop', style: islVar(k) },
          h('a', { className: 'seg-link', href: '#' + k },
            h('span', { className: 'code' }, meta(k).code),
            h('span', { className: 'nm' }, islandName(k)),
            h('span', { className: 'dt' }, when))));
      }
    }
    const plan = D.plan;
    if (plan && plan.departure && plan.departure < D.trip.end) {
      el.append(h('li', { className: 'seg-stop fly' },
        h('span', { className: 'code' }, 'ICN'),
        h('span', { className: 'nm' }, '귀국'),
        h('span', { className: 'dt' }, h('span', null, md(plan.departure)))));
    }
    return el;
  }
  function moneyCard() {
    const t = totals();
    const budget = D.trip.budget;
    const pct = t.total ? Math.min(100, t.paid / t.total * 100) : 0;
    const ref = stayReference();
    return h('section', { className: 'money', 'aria-label': '비용' },
      h('div', { className: 'k' }, '예상 총액'),
      h('div', { className: 'big' }, won(t.total), h('small', null, '원')),
      h('div', { className: 'small' }, t.estimate ? '시세 기준 예상 ' + manwon(t.estimate) + ' 포함' : '확정가 합계'),
      h('div', { className: 'progress', role: 'img', 'aria-label': '결제 진행 ' + Math.round(pct) + '%' }, h('i', { style: 'width:' + pct.toFixed(1) + '%' })),
      h('div', { className: 'row' },
        h('span', null, '결제 ', h('b', null, won(t.paid)), '원'),
        h('span', null, '남은 ', h('b', null, won(Math.max(t.total - t.paid, 0))), '원'),
      ),
      h('div', { className: 'row' },
        h('span', null, t.unknown ? '금액 미정 ' + t.unknown + '건' : '미정 항목 없음'),

      // 숙소: 체크인 날부터 체크아웃 전날까지 그 밤의 숙소를 보여 준다
      for (const it of D.items) {
        if (it.category !== 'stay' || it.status === 'cancelled' || !it.start || !it.end) continue;
        if (date >= it.start && date < it.end) rows.push(h('div', { className: 'ev-row' }, h('span', { className: 'tm' }, '숙박'), h('span', null, it.title), badge(it.status)));
      }
      const iv = nightIslands.length === 1 ? islVar(nightIslands[0].key) : '';
      const dotEl = nightIslands.length > 1
        ? h('i', { className: 'split', style: '--isl-a: var(' + meta(nightIslands[0].key).color + '); --isl-b: var(' + meta(nightIslands[1].key).color + ')' })
        : h('i', { style: iv || null });
      return h('li', { className: 'day' },
        h('div', { className: 'd' }, h('b', null, md(date) + ' ' + dow(date)), h('small', null, n ? n + '일차' : '여행 전후')),
        h('div', { className: 'rail', 'aria-hidden': 'true' }, dotEl),
        h('div', { className: 'ev' }, rows.length ? rows : h('span', { className: 'empty' }, '비어 있음')),
      );
    }));
    list.addEventListener('click', e => { const a = e.target.closest('[data-course]'); if (a) pendingScroll = 'course-' + a.dataset.course; });
    const nights = daysBetween(t.start, t.end);
    $('view').replaceChildren(h('div', { className: 'page' },
      h('div', { className: 'page-title' }, h('h2', null, '일정'), h('span', null, withDow(t.start) + ' – ' + mdDow(t.end) + ' · ' + nights + '박 ' + (nights + 1) + '일')),
      chainStrip(),
      list));
  }

  // ---------- 비용 ----------
  function renderCosts() {
    const t = totals();
    const cs = (k, v, sub, cls) => h('div', { className: 'cstat' }, h('span', { className: 'k' }, k), h('span', { className: 'v ' + (cls || '') }, v), sub ? h('span', { className: 's' }, sub) : null);
    const pct = t.total ? Math.min(100, t.paid / t.total * 100) : 0;
    const blocks = [];
    const empty = [];
    for (const cat of CATEGORY_ORDER) {
      const list = D.items.filter(i => i.category === cat);
      if (!list.length) { empty.push(CATEGORY[cat]); continue; }
      blocks.push(h('section', { className: 'cat' }, h('h3', null, CATEGORY[cat]), h('ul', { className: 'items' }, list.map(it => {
        const c = costOf(it);
        const when = it.start ? (withDow(it.start) + (it.end && it.end !== it.start ? ' – ' + mdDow(it.end) : '')) : '';
        const sub = [when, it.vendor, it.quantity && it.quantity > 1 ? it.quantity + '인' : ''].filter(Boolean).join(' · ');
        const pays = it.payments || [];
        return h('li', { className: 'item' },
          h('div', null,
            h('div', { className: 't' }, it.title, badge(it.status)),
            sub ? h('div', { className: 'sub' }, sub) : null,
            c.kind === 'estimate' ? h('div', { className: 'sub' }, md(c.quote.date) + ' 시세 ' + won(c.quote.price) + '원 × ' + (it.quantity || 1) + ' · ', h('a', { href: '#prices/' + it.tracker }, '시세 보기')) : null,
            it.note ? h('div', { className: 'sub' }, it.note) : null,
            it.url ? h('div', { className: 'sub' }, ext(it.url, '링크')) : null,
            pays.length ? h('ul', null, pays.map(p => h('li', null, dot(p.date) + ' · ' + won(p.amount) + '원' + (p.note ? ' · ' + p.note : '')))) : null,
          ),
          h('div', { className: 'amt' }, amountText(c), c.amount !== null && c.kind !== 'cancelled' ? h('small', null, c.paid >= c.amount && c.amount ? '완납' : '남은 ' + won(Math.max(c.amount - c.paid, 0))) : null),
        );
      }))));
    }
    const ref = stayReference();
    $('view').replaceChildren(h('div', { className: 'page' },
      h('div', { className: 'page-title' }, h('h2', null, '비용'), h('span', null, '2인 기준')),
      h('div', { className: 'cost-stats' },
        cs('예상 총액', won(t.total) + '원', t.estimate ? '시세 기준 예상 포함' : '확정가 합계'),
        cs('확정 금액', won(t.fixed) + '원'),
        cs('결제 완료', won(t.paid) + '원', '남은 ' + won(Math.max(t.total - t.paid, 0)) + '원', t.paid ? 'down' : ''),
        cs('금액 미정', t.unknown + '건', D.trip.budget ? '예산 ' + manwon(D.trip.budget) : '예산 미설정'),
      ),
      h('div', { className: 'progress', role: 'img', 'aria-label': '결제 진행 ' + Math.round(pct) + '%' }, h('i', { style: 'width:' + pct.toFixed(1) + '%' })),
      blocks,
      empty.length ? h('p', { className: 'empty-cats' }, '아직 항목 없음: ' + empty.join(' · ')) : null,
      ref.parts.length ? h('section', { className: 'cat' },
        h('h3', null, '숙소 참고 금액'),
        h('div', { className: 'money' },
          h('div', { className: 'small' }, refBasis(ref.parts) + ' × 박수. 예약 전이라 총액에는 넣지 않았어요.'),
          h('ul', { className: 'ref-list' }, ref.parts.map(p => h('li', null,
            h('span', null, h('span', { className: 'tag isl', style: islVar(p.key) }, islandName(p.key)), ' ', p.x.ht.nameKo, p.fav ? ' (찜)' : ' (최저)'),
            h('span', { className: 'num' }, p.nights + '박 ' + won(p.amount))))),
          h('div', { className: 'row' }, h('span', null, '합계'), h('b', null, won(ref.sum) + '원')),
        )) : null,
    ));
  }

  // ---------- 가격 시트 ----------
  const sheet = $('sheet');
  let curTracker = null, range = 'all', mode = 'line';
  let chart = null, series = null;
  const hasLib = typeof LightweightCharts !== 'undefined';

  function hexToRgba(hex, a) {
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    let v = m[1]; if (v.length === 3) v = v.split('').map(ch => ch + ch).join('');
    const n = parseInt(v, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function trackerColor(tr) {
    const k = islandOfTracker.get(tr.id);
    return css(k ? meta(k).color : '--accent');
  }
  function chartTheme() {
    return {
      layout: { background: { type: 'solid', color: css('--surface') }, textColor: css('--muted'), fontFamily: 'IBM Plex Mono, ui-monospace, monospace', fontSize: 11 },
      grid: { vertLines: { color: css('--grid') }, horzLines: { color: css('--grid') } },
      rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false },
      crosshair: { vertLine: { color: css('--muted'), labelBackgroundColor: css('--fg') }, horzLine: { color: css('--muted'), labelBackgroundColor: css('--fg') } },
    };
  }
  function ensureChart() {
    if (chart || !hasLib) return;
    chart = LightweightCharts.createChart($('chart'), Object.assign({
      autoSize: true, handleScroll: { vertTouchDrag: false }, localization: { locale: 'ko-KR', priceFormatter: p => manwon(p), dateFormat: 'yyyy.MM.dd' },
    }, chartTheme()));
    chart.subscribeCrosshairMove(p => renderLegend(p && p.time ? p.time : null));
  }
  // 주봉: 월요일 기준으로 묶어 시가/고가/저가/종가
  function weekly(list) {
    const m = new Map();
    for (const q of list) {
      const d = parseDay(q.date); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      const k = ymd(d);
      const c = m.get(k);
      if (!c) m.set(k, { time: k, open: q.price, high: q.price, low: q.price, close: q.price });
      else { c.high = Math.max(c.high, q.price); c.low = Math.min(c.low, q.price); c.close = q.price; }
    }
    return [...m.values()];
  }
  function renderChart() {
    const list = quotesOf(curTracker.id);
    $('chart-empty').hidden = list.length > 0;
    $('chart-note').textContent = list.length === 1 ? '아직 하루치 기록이라 점 하나로 보여요. 매일 쌓이면 선이 돼요.' : '';
    if (!hasLib) { if (list.length) { $('chart-empty').hidden = false; $('chart-empty').textContent = '차트 라이브러리를 불러오지 못했어요'; } return; }
    ensureChart();
    if (series) { chart.removeSeries(series); series = null; }
    const color = trackerColor(curTracker);
    if (mode === 'candle') {
      series = chart.addCandlestickSeries({ upColor: css('--up'), downColor: css('--down'), borderVisible: false, wickUpColor: css('--up'), wickDownColor: css('--down') });
      series.setData(weekly(list));
    } else {
      series = chart.addAreaSeries({ lineColor: color, lineWidth: 2, topColor: hexToRgba(color, 0.18), bottomColor: hexToRgba(color, 0), crosshairMarkerRadius: 4, pointMarkersVisible: list.length < 3 });
      series.setData(list.map(q => ({ time: q.date, value: q.price })));
    }
    if (curTracker.targetPrice) series.createPriceLine({ price: curTracker.targetPrice, color: css('--target'), lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '목표가' });
    applyRange();
  }
  function applyRange() {
    if (!chart || !curTracker || !quotesOf(curTracker.id).length) return;
    if (range === 'all') { chart.timeScale().fitContent(); return; }
    const from = new Date(); from.setDate(from.getDate() - Number(range));
    try { chart.timeScale().setVisibleRange({ from: ymd(from), to: today }); } catch (e) { chart.timeScale().fitContent(); }
  }
  function renderLegend(time) {
    const list = quotesOf(curTracker.id);
    const q = time ? list.find(x => x.date === (typeof time === 'string' ? time : ymd(new Date(time.year, time.month - 1, time.day)))) : list[list.length - 1];
    if (!q) { $('legend').replaceChildren(); return; }
    fill($('legend'), h('span', null, withDow(q.date)), h('span', null, h('b', null, won(q.price)), '원'), q.note ? h('span', null, q.note) : null);
  }
  const stat = (k, v, sub, cls) => h('div', { className: 'stat' }, h('span', { className: 'k' }, k), h('span', { className: 'v ' + (cls || '') }, v), sub ? h('span', { className: 's' }, sub) : null);

  function fillSheet() {
    const tr = curTracker;
    const islKey = islandOfTracker.get(tr.id);
    sheet.style.cssText = islKey ? islVar(islKey) : '';
    $('sh-cat').textContent = CATEGORY[tr.category] + ' 시세' + (islKey ? ' · ' + islandName(islKey) : '');
    $('sh-title').textContent = tr.label;
    $('sh-detail').textContent = [tr.detail, tr.unit].filter(Boolean).join(' · ');

    const list = quotesOf(tr.id);
    const last = list[list.length - 1], prev = list[list.length - 2];
    $('pr-now').replaceChildren(last ? won(last.price) : '—', h('small', null, '원'));
    $('pr-quote-label').textContent = !last ? '최저가' : last.date === today ? '오늘의 최저가' : dot(last.date) + ' 최저가';
    const dEl = $('pr-delta');
    if (last && prev) {
      const diff = last.price - prev.price;
      dEl.className = 'delta ' + trendCls(diff);
      dEl.textContent = deltaText(diff, prev.price);
      $('pr-delta-sub').textContent = '직전 기록일 ' + dot(prev.date) + ' 대비';
    } else { dEl.className = 'delta flat'; dEl.textContent = last ? '비교할 전일 기록 없음' : '기록을 기다리는 중'; $('pr-delta-sub').textContent = ' '; }

    const vals = list.map(q => q.price);
    const min = vals.length ? Math.min(...vals) : null, max = vals.length ? Math.max(...vals) : null;
    const minQ = list.find(q => q.price === min), maxQ = list.find(q => q.price === max);
    const tp = tr.targetPrice;
    const fromMin = last && min !== null ? last.price - min : null;
    const nights = tr.category === 'stay' && islKey ? isle(islKey).nights || tr.nights : null;
    fill($('pr-stats'),
      stat('기간 최저', min !== null ? won(min) : '—', minQ ? dot(minQ.date) : null),
      stat('기간 최고', max !== null ? won(max) : '—', maxQ ? dot(maxQ.date) : null),
      stat('최저 대비', fromMin === null ? '—' : fromMin === 0 ? '최저가' : '+' + won(fromMin), null, fromMin === 0 ? 'down' : fromMin ? 'up' : ''),
      stat('목표가', tp ? won(tp) : '미설정', tp && last ? (last.price <= tp ? '도달' : manwon(last.price - tp) + ' 남음') : null, tp ? (last && last.price <= tp ? 'down' : '') : 'muted'),
      nights && last ? stat(nights + '박 합계', manwon(last.price * nights), '1박 × ' + nights) : null,
      stat('기록한 날', list.length + '일', list.length ? dot(list[0].date) + '부터' : null),
    );
    const cs = D.collectStatus ? D.collectStatus[tr.id] : null;
    const csMsg = csText(cs);
    fill($('sh-links'),
      csMsg ? tag(dot(cs.date) + ' ' + csMsg, 'warn') : null,
      tr.url ? ext(tr.url, 'Google 에서 보기', 'pill') : null,
      islKey && tr.category === 'stay' ? h('a', { className: 'pill', href: '#' + islKey, 'data-close': '1' }, islandName(islKey) + ' 숙소 비교') : null,
    );
    const rows = [];
    for (let i = list.length - 1; i >= 0; i--) {
      const q = list[i], p = list[i - 1];
      const diff = p ? q.price - p.price : null;
      rows.push(h('li', null,
        h('span', { className: 'num' }, withDow(q.date)),
        h('span', { className: 'p' }, won(q.price)),
        h('span', { className: 'df ' + (diff === null ? 'flat' : trendCls(diff)) }, diff === null ? '—' : arrow(diff) + won(Math.abs(diff))),
        h('span', { className: 'src' }, tag(q.kind === 'auto' ? '자동' : '직접', q.kind === 'auto' ? 'on' : ''), q.source || '', q.note ? ' · ' + q.note : ''),
      ));
    }
    $('pr-log').replaceChildren(...(rows.length ? rows : [h('li', null, h('span', { className: 'muted' }, '아직 없어요.'))]));

    // 다른 항목: 분류별, 숙소는 섬별로 묶는다
    const sel = $('tracker-select');
    const act = activeTrackers();
    const groups = [];
    for (const cat of CATEGORY_ORDER) {
      const inCat = act.filter(x => x.category === cat);
      if (!inCat.length) continue;
      if (cat === 'stay') {
        for (const k of islandKeys()) {
          const g = inCat.filter(x => islandOfTracker.get(x.id) === k);
          if (g.length) groups.push([CATEGORY[cat] + ' · ' + islandName(k), g]);
        }
        const rest = inCat.filter(x => !islandOfTracker.has(x.id));
        if (rest.length) groups.push([CATEGORY[cat], rest]);
      } else groups.push([CATEGORY[cat], inCat]);
    }
    sel.replaceChildren(...groups.map(([label, g]) => h('optgroup', { label }, g.map(x => h('option', { value: x.id, selected: x === tr }, x.label)))));
    sel.parentElement.hidden = act.length < 2;

  }
  $('tracker-select').addEventListener('change', e => { location.replace('#prices/' + e.target.value); });
  $('sh-links').addEventListener('click', e => { if (e.target.closest('[data-close]')) { sheetPushed = false; closingByRoute = true; sheet.close(); } });
  document.querySelectorAll('[data-range]').forEach(b => b.addEventListener('click', () => {
    range = b.dataset.range;
    document.querySelectorAll('[data-range]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    applyRange();
  }));
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderChart();
  }));

  let sheetPushed = false, closingByRoute = false;
  function openSheet(tr) {
    curTracker = tr;
    fillSheet();
    if (!sheet.open) {
      try { sheet.showModal(); } catch (e) { sheet.setAttribute('open', ''); }
      document.documentElement.classList.add('lock-scroll');
      sheet.scrollTop = 0;
    }
    renderChart(); renderLegend(null);
  }
  $('sh-close').addEventListener('click', () => sheet.close());
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });
  sheet.addEventListener('close', () => {
    document.documentElement.classList.remove('lock-scroll');
    if (closingByRoute) { closingByRoute = false; return; }
    if (sheetPushed) { sheetPushed = false; history.back(); }
    else history.replaceState(null, '', '#' + (curView || 'home'));
  });

  // ---------- 화면 전환 ----------
  let curView = null, lastIsland = null, pendingScroll = null;
  function baseOf(tr) { return islandOfTracker.get(tr.id) || 'home'; }
  function showView(name) {
    const isl = islandKeys();
    if (!['home', 'schedule', 'costs', ...isl].includes(name)) name = 'home';
    if (name !== curView) {
      curView = name;
      if (isl.includes(name)) { lastIsland = name; renderIsland(name); }
      else if (name === 'schedule') renderSchedule();
      else if (name === 'costs') renderCosts();
      else renderHome();
      if (pendingScroll && $(pendingScroll)) { const el = $(pendingScroll); requestAnimationFrame(() => el.scrollIntoView({ block: 'start' })); }
      else { try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch (e) { window.scrollTo(0, 0); } }
      pendingScroll = null;
    }
    const islandHref = '#' + (lastIsland || isl[0] || 'home');
    document.querySelectorAll('[data-nav]').forEach(a => {
      const key = a.dataset.nav;
      if (key === 'island') a.setAttribute('href', islandHref);
      const on = key === 'island' ? isl.includes(curView) : key === curView;
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }
  function route(fromHashChange) {
    let raw = location.hash.slice(1);
    try { raw = decodeURIComponent(raw); } catch (e) {}
    let [name, arg] = raw.split('/');
    name = name || 'home';
    if (name === 'overview') name = 'home';
    if (name === 'stays' || name === 'courses') name = lastIsland || islandKeys()[0] || 'home';
    if (name === 'prices') {
      const tr = (arg && trackerById.get(arg)) || activeTrackers()[0];
      if (tr) {
        if (!sheet.open) sheetPushed = !!(fromHashChange && curView);
        if (!curView) showView(baseOf(tr));
        openSheet(tr);
        return;
      }
      name = 'home';
    }
    if (sheet.open) { closingByRoute = true; sheetPushed = false; sheet.close(); }
    showView(name);
  }
  window.addEventListener('hashchange', () => D && route(true));

  function open(data) {
    D = data;
    favs = readFavs();
    trackerById = new Map(D.trackers.map(t => [t.id, t]));
    islandOfTracker = new Map();
    for (const isl of staysIslands()) for (const ht of isl.hotels || []) if (ht.tracker) islandOfTracker.set(ht.tracker, isl.key);
    $('lock').hidden = true;
    $('app').hidden = false;
    renderHead();
    route(false);
  }

  const reTheme = () => { if (chart) { chart.applyOptions(chartTheme()); if (D && curTracker && sheet.open) renderChart(); } };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', reTheme); } catch (e) {}
  new MutationObserver(reTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  boot();
})();
</script>
</body>
</html>
